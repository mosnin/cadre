<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A cloud workforce for your company." />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-title" content="Cadre" />
    <link rel="icon" href="/brand/cadre-favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=cadre-2" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cadre" />
    <meta property="og:description" content="A cloud workforce for your company." />
    <meta property="og:image" content="https://www.cadre.to/brand/cadre-social.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cadre" />
    <meta name="twitter:description" content="A cloud workforce for your company." />
    <meta name="twitter:image" content="https://www.cadre.to/brand/cadre-social.png" />
    <title>Cadre</title>
    <script>
      (() => {
        const key = "rakazo.uiAppearance";
        let preference = "system";
        try {
          const stored = localStorage.getItem(key);
          if (stored === "system" || stored === "light" || stored === "dark") preference = stored;
        } catch {}
        const systemLight =
          typeof matchMedia === "function" && matchMedia("(prefers-color-scheme: light)").matches;
        const theme = preference === "system" ? (systemLight ? "light" : "dark") : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#ffffff" : "#000000");
      })();
    </script>
  </head>
  <body>
    <section id="startup-status" role="status" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:16px;padding:24px max(24px,calc((100vw - 480px)/2));background:Canvas;color:CanvasText;font:16px system-ui;z-index:1000">
      <h1 style="margin:0;font-size:20px;font-weight:500;line-height:1.4">Loading Cadre…</h1>
      <p id="startup-detail" style="margin:0;font-size:15px;line-height:1.5" hidden>Check your connection, then reload. Your workspace is saved.</p>
      <button id="startup-reload" hidden type="button" style="min-height:44px;padding:8px 16px;border:1px solid GrayText;border-radius:12px;background:Canvas;color:CanvasText;font:inherit;cursor:pointer" onclick="location.reload()">Reload Cadre</button>
    </section>
    <script>
      (() => {
        const failed = () => {
          const panel = document.getElementById("startup-status");
          if (!panel) return;
          panel.querySelector("h1").textContent = "Cadre couldn’t load";
          document.getElementById("startup-detail").hidden = false;
          document.getElementById("startup-reload").hidden = false;
        };
        window.addEventListener("error", failed, true);
        window.addEventListener("unhandledrejection", failed);
        setTimeout(failed, 15000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
