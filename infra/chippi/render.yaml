# Dedicated Chippi resources. Do not apply the standalone Cadre blueprint to an existing Chippi database.
projects:
  - name: Chippi Workforce
    environments:
      - name: Workforce
        databases:
          - name: chippi-workforce-db
            plan: basic-256mb
            region: virginia
            postgresMajorVersion: "16"
            ipAllowList: []
        services:
          - type: web
            name: chippi-workforce-runtime
            runtime: node
            plan: standard
            region: virginia
            buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @rakazo/db generate
            preDeployCommand: pnpm --filter @rakazo/db migrate
            startCommand: node infra/render-start.mjs
            healthCheckPath: /health
            envVars:
              - key: NODE_VERSION
                value: 22.22.2
              - key: NODE_ENV
                value: production
              - key: DATABASE_URL
                fromDatabase:
                  name: chippi-workforce-db
                  property: connectionString
              - key: CHIPPI_WORKFORCE_SECRET
                generateValue: true
              - key: CHIPPI_APP_ORIGIN
                sync: false
              - key: BETTER_AUTH_SECRET
                generateValue: true
              - key: ENCRYPTION_KEY
                generateValue: true
              - key: SCREEN_PROXY_SECRET
                sync: false
              - key: WEB_ORIGIN
                sync: false
              - key: BETTER_AUTH_URL
                sync: false
              - key: API_URL
                sync: false
              - key: SCREEN_GATEWAY_ORIGIN
                sync: false
              - key: STORAGE_PROVIDER
                value: r2-gateway
              - key: R2_GATEWAY_URL
                sync: false
              - key: STORAGE_GATEWAY_TOKEN
                sync: false
              - key: SANDBOX_PROVIDER
                value: fly
              - key: FLY_COMPUTER_IMAGE
                sync: false
              - key: FLY_COMPUTER_APP
                sync: false
              - key: FLY_API_TOKEN
                sync: false
              - key: FLY_COMPUTER_REGION
                value: iad
              - key: AGENT_RUNTIME
                value: pi
              - key: PI_DEFAULT_PROVIDER
                value: openrouter
              - key: PI_DEFAULT_MODEL
                sync: false
              - key: OPENROUTER_API_KEY
                sync: false
              - key: WAKEUP_DRIVER
                value: graphile
              - key: SIGNUPS_ENABLED
                value: "false"
              - key: MCP_STDIO_ENABLED
                value: "false"
              - key: DATA_DIR
                value: /tmp/chippi-workforce
